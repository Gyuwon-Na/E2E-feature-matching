# Fill in module/class/checkpoint/output_spec for your own model.
# The output_spec lets the evaluator parse your model output without editing the framework code.
dataset:
  manifest: ../example_data/manifest_smoke.jsonl

runtime:
  output_dir: ../evaluate_outputs/user_model
  checkpoint_root: ../checkpoints
  fail_fast: false

metrics:
  pck_thresholds: [1, 3, 5]
  homography_fit:
    method: usac_magsac
    ransac_reproj_threshold: 3.0
    max_iters: 10000
    confidence: 0.999
    max_fit_points: 5000
  rotation:
    metric: alignment_error_px
    bins: [0, 5, 15, 30, 60, 90, 180]
  stage_pairs:
    - [after_transformer, final]

models:
  - name: my_model
    kind: user_torch_module
    device: auto

    # Example: if your code defines class MyMatcher in project/models/net.py
    # module: project.models.net
    # class_name: MyMatcher
    module: your_module_path_here
    class_name: YourModelClassHere

    # The checkpoint is resolved relative to the YAML file; by default you can keep weights under ../checkpoints
    checkpoint: ../checkpoints/your_model.pth

    # Optional model constructor kwargs
    init_args: {}

    # Optional checkpoint-loading behavior
    checkpoint_key: null
    strict_load: true
    strip_prefixes: []

    # How to call the model
    forward:
      method: forward
      input_mode: tensor_rgb_0_1
      call_with_kwargs: true
      input_names: [image0, image1]
      extra_kwargs: {}

    # Tell the evaluator how to read outputs from your model.
    # Supported dense flow modes:
    #   absolute          -> [H,W,2] target pixel coordinates
    #   displacement      -> [H,W,2] pixel displacements added to source grid
    #   normalized_target -> [H,W,2] in [-1,1], converted to target pixel coordinates
    #   normalized_pair4  -> [H,W,4] = [src_x, src_y, dst_x, dst_y] in [-1,1]
    output_spec:
      default:
        homography: homography_0to1
        flow: flow01
        flow_mode: absolute
        valid_mask: valid_mask
        confidence: confidence
        matches0: matches0
        matches1: matches1
        sparse_confidence: scores
      stages:
        after_transformer:
          homography: intermediate.homography_0to1
          flow: intermediate.flow01
          flow_mode: absolute
          valid_mask: intermediate.valid_mask
          confidence: intermediate.confidence
          matches0: intermediate.matches0
          matches1: intermediate.matches1
          sparse_confidence: intermediate.scores
