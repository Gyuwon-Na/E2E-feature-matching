# Optional dense baselines. These are not included in the default safe suite because their install paths are usually more brittle.
dataset:
  manifest: ../example_data/manifest_smoke.jsonl

runtime:
  output_dir: ../evaluate_outputs/dense_optional
  checkpoint_root: ../checkpoints
  fail_fast: false

metrics:
  pck_thresholds: [1, 3, 5]
  homography_fit:
    method: usac_magsac
    ransac_reproj_threshold: 3.0
    max_iters: 10000
    confidence: 0.999
    max_fit_points: 5000
  rotation:
    metric: alignment_error_px
    bins: [0, 5, 15, 30, 60, 90, 180]
  stage_pairs:
    - [after_transformer, final]

models:
  - name: roma_outdoor
    kind: roma
    device: auto

  - name: dkm_base
    kind: dkm
    device: auto
    version: v11
    upsample_preds: true
