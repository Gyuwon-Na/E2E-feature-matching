dataset:
  manifest: ../example_data/manifest_smoke.jsonl

runtime:
  output_dir: ../evaluate_outputs/smoke_test
  checkpoint_root: ../checkpoints
  fail_fast: false

metrics:
  pck_thresholds: [1, 3, 5]
  homography_fit:
    method: usac_magsac
    ransac_reproj_threshold: 3.0
    max_iters: 10000
    confidence: 0.999
    max_fit_points: 5000
  rotation:
    metric: alignment_error_px
    bins: [0, 5, 15, 30, 60, 90]
  stage_pairs:
    - [after_transformer, final]

models:
  - name: mock_gt_stage
    kind: mock_gt_stage
    device: cpu
    intermediate_stage_name: after_transformer
    intermediate_noise_px: 4.0
    intermediate_keep_prob: 0.55
    final_noise_px: 1.0
    final_keep_prob: 0.90
